name: Capture paper closing prices

# Every 15 minutes, record Kalshi's current public price for each open paper row
# kicking off in the next 45 minutes, so closing-line value is measured against a
# real near-kickoff price. PAPER ONLY: read-only unauthenticated GETs, no orders,
# no credentials. The report (paper-settle.yml) merges data/paper/closing.jsonl.
#
# Same commit/push retry loop as paper-settle.yml.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Record closing prices
        run: python3 scripts/paper_close.py
      - name: Commit and push if changed
        if: success()
        run: |
          if [ -z "$(git status --porcelain data/paper/closing.jsonl)" ]; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper/closing.jsonl
          git commit -m "Paper closing prices [automated]"
          for attempt in 1 2 3 4; do
            git pull --rebase -q -X theirs && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          exit 1
